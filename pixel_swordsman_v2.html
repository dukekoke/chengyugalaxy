<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:var(--site-font-body);background:var(--site-background);color:var(--site-on-background);touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:var(--site-secondary);color:var(--site-on-secondary);flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:.04em;font-size:calc(17px * var(--site-heading-scale))}
.stats{display:flex;gap:10px;align-items:center;font-size:12px;font-weight:800}
.bar{height:9px;width:95px;background:#3c3030;border:2px solid #0a1014;display:inline-block;vertical-align:middle}
.fill{height:100%;background:#e45757;width:100%;transition:width .12s}
.energy .fill{background:#55d5d0}
.stage{font-size:12px;color:#f5d28c;font-weight:800}
.game-wrap{flex:1;min-height:0;position:relative;background:#0b1218;display:flex;align-items:center;justify-content:center}

.hud-note{position:absolute;top:8px;left:8px;right:8px;text-align:center;font-size:12px;color:#fff2cf;text-shadow:2px 2px #111;pointer-events:none}
.bottom{background:#17262b;padding:8px 12px max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:10px;touch-action:none}
.dpad,.actions{display:flex;gap:8px;align-items:center;touch-action:none}
.dpad{padding:4px;border-radius:14px;background:#0f1b1f;border:2px solid #2b403c}
.dpad .control{pointer-events:none}
.control{border:2px solid #d5bc80;background:#31433f;color:#fff5d8;min-width:56px;height:56px;border-radius:10px;font-size:22px;font-weight:900;box-shadow:0 4px #0a1114;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:0 6px;font-family:inherit}

.control.action{background:#8b3f2f}
.control.special{background:#6c4aa0;font-size:14px;min-width:66px}
.control.special.locked{opacity:.4;filter:grayscale(.4)}
.control.special.ready{animation:pulse .7s infinite alternate;box-shadow:0 4px #0a1114,0 0 14px #b79cff}
@keyframes pulse{to{background:#9a76e6}}
.legend{font-size:11px;opacity:.8;text-align:center;line-height:1.5}

.mainbtn{background:#8b3f2f;margin-top:8px;width:100%}

<body><main id="app"><header class="top"><div class="brand">⚔ 像素劍客：魔王之戰</div><div class="stage" id="stageLabel">第一關｜盜賊攻城</div><div class="stats"><span>❤️ <b id="hpText">100</b>% <i class="bar"><i class="fill" id="hpFill" style="display:block"></i></i></span><span class="energy">⚡ <b id="energyText">0</b>% <i class="bar"><i class="fill" id="energyFill" style="display:block;width:0%"></i></i></span></div></header>
<section class="game-wrap"><canvas id="game" width="480" height="270" aria-label="像素劍客遊戲畫面"></canvas><div class="hud-note" id="note">擊退盜賊，守住城堡！</div>
<div class="overlay" id="overlay"><div class="panel" id="panel"><h1>像素劍客</h1><p>四大關卡等你挑戰！第三關解鎖大招，第四關迎戰魔王。</p><p>第一關開始時，你只有一把木刀。</p><p class="keys">鍵盤：← → 或 A D 移動　↑ W 空白鍵 跳躍<br>J Z 攻擊　K X 大招　Enter 確認<br>觸控：左下方向鍵可滑動切換，右下為跳躍／攻擊／大招</p><button class="mainbtn" id="startBtn">開始冒險 ▶</button></div></div></section>
<footer class="bottom">
<div class="dpad" id="dpad"><button class="control" id="btnL" tabindex="-1" aria-label="向左">◀</button><button class="control" id="btnR" tabindex="-1" aria-label="向右">▶</button></div>
<div class="legend">鍵盤：← → 移動<br>↑／空白 跳躍<br>J 攻擊・K 大招</div>
<div class="actions"><button class="control" data-tap="jump" tabindex="-1" aria-label="跳躍">⬆<small>跳躍</small></button><button class="control action" data-tap="attack" tabindex="-1" aria-label="攻擊">⚔<small>攻擊</small></button><button class="control special locked" id="specialBtn" data-tap="special" tabindex="-1">大招 🔒</button></div>
</footer></main>
<script>
(()=>{'use strict';
const W=480,H=270,GROUND=202,ATK=18,STEP=1000/60;
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;

function finish(c,ax,ol){ol=ol||[14,10,20];const w=c.width+2,h=c.height+2,o=mk(w,h),g=o.getContext('2d');g.drawImage(c,1,1);
 const id=g.getImageData(0,0,w,h),d=id.data,src=new Uint8ClampedArray(d);const A=(x,y)=>x<0||y<0||x>=w||y>=h?0:src[(y*w+x)*4+3];
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(src[i+3]===0&&(A(x-1,y)||A(x+1,y)||A(x,y-1)||A(x,y+1))){d[i]=ol[0];d[i+1]=ol[1];d[i+2]=ol[2];d[i+3]=255}}
 g.putImageData(id,0,0);return{c:o,ax:ax+1,ay:h-1}}
function whiten(s){const c=mk(s.c.width,s.c.height,(r,g)=>{g.drawImage(s.c,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,s.c.width,s.c.height)});return{c,ax:s.ax,ay:s.ay}}

function pline(x0,y0,x1,y1,col,th){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let err=dx+dy;ctx.fillStyle=col;const o=th>>1;for(let n=0;n<400;n++){ctx.fillRect(x0-o,y0-o,th,th);if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>=dy){err+=dy;x0+=sx}if(e2<=dx){err+=dx;y0+=sy}}}

/* ============ 猴妖 ============ */

 $('hpText').textContent=Math.ceil(p.hp);$('hpFill').style.width=p.hp+'%';$('energyText').textContent=Math.floor(p.energy);$('energyFill').style.width=p.energy+'%';
 const b=$('specialBtn');if(level<3){b.textContent='大招 🔒';b.className='control special locked'}else if(p.energy<100){b.textContent='大招 '+Math.floor(p.energy)+'%';b.className='control special locked'}else{b.textContent='大招 ✦';b.className='control special ready'}}
function startLevel(n){level=n;state='playing';frame=0;enemies=[];parts=[];waves=[];beams=[];kills=0;spawned=0;spawnTimer=40;clearT=0;
 const p=player;p.x=80;p.y=GROUND;p.vx=0;p.vy=0;p.kb=0;p.atk=-1;p.sp=0;p.invuln=60;p.hp=Math.max(1,p.hp);if(n>=3)p.energy=Math.max(p.energy,25);
 boss=n===4?{x:410,y:GROUND,hw:26,h:100,hp:100,hit:0,face:-1,st:'walk',t:70,anim:0,dead:0}:null;
 bg=getBG(n-1);initAmbient(n);$('stageLabel').textContent=levels[n-1].name;setNote(levels[n-1].tip,0);$('overlay').classList.add('hidden');updateHUD(true)}
function showPanel(title,html,button,action){$('panel').innerHTML='<h1>'+title+'</h1>'+html+'<button class="mainbtn" id="panelBtn">'+button+'</button>';$('overlay').classList.remove('hidden');$('panelBtn').onclick=action}
$('startBtn').onclick=()=>{resetPlayer();startLevel(1)};
function upgrade(){state='upgrade';
 $('panel').innerHTML='<h1>關卡完成！</h1><p>本關完成！選擇一項升級，再前往下一關。（可按 1 / 2 / 3）</p><div class="choices"><button class="choice" data-up="weapon">⚔ 強化武器 [1]<small>攻擊距離與傷害提升</small></button><button class="choice" data-up="energy">⚡ 增加能量 [2]<small>能量上限不變，初始能量 +35%</small></button><button class="choice" data-up="health">❤️ 增加生命 [3]<small>恢復 30% 生命值（最多 100%）</small></button></div>';
 $('overlay').classList.remove('hidden');
 document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{if(state!=='upgrade')return;const u=b.dataset.up;
  if(u==='weapon'){player.weapon++;player.damage=Math.min(3,player.damage+1)}if(u==='energy')player.energy=Math.min(100,player.energy+35);if(u==='health')player.hp=Math.min(100,player.hp+30);
  if(level<4)startLevel(level+1);else winGame()})}
function winGame(){if(state==='win')return;state='win';showPanel('🏆 魔王已被擊敗！','<p>你守住了城堡，征服四大關卡！</p><p>最終武器等級：'+(player.weapon+1)+'　剩餘生命：'+Math.ceil(player.hp)+'%</p>','再玩一次 ↻',()=>{resetPlayer();startLevel(1)})}
function loseGame(){if(state==='lose')return;state='lose';showPanel('💥 挑戰失敗','<p>劍客倒下了。升級武器、善用跳躍並抓準攻擊時機，再試一次吧！</p>','重新挑戰 ↻',()=>{resetPlayer();startLevel(1)})}

/* ============ 戰鬥 ============ */
function burst(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-2.2,2.2),vy:rnd(-3.2,-.5),life:rnd(16,30),c,s:Math.random()<.4?2:3})}
function hurt(d,sx){const p=player;if(p.invuln>0||state!=='playing')return;p.hp-=d;p.invuln=50;p.kb=(p.x>=sx?1:-1)*5;p.vy=-3.5;p.onGround=false;p.atk=-1;shake=5;burst(p.x,p.y-26,'#d83a3a',10);burst(p.x,p.y-26,'#f6c96a',4);if(p.hp<=0){p.hp=0;updateHUD();loseGame()}}
function damageEnemy(e,d,f){e.hp-=d;e.hitT=8;e.stun=14;e.kb=f*3.2;e.atk=0;burst(e.x,e.y-e.h/2,'#f6c96a',6);burst(e.x,e.y-e.h/2,e.type==='alien'?'#7ff7ff':'#d83a3a',4);player.energy=Math.min(100,player.energy+4);
 if(e.hp<=0){e.dying=1;kills++;player.energy=Math.min(100,player.energy+8);burst(e.x,e.y-e.h/2,'#fff',8)}}
function hitBoss(d){const b=boss;if(!b||b.dead)return;b.hp=Math.max(0,b.hp-d);b.hit=8;player.energy=Math.min(100,player.energy+6);shake=3;burst(b.x+rnd(-14,14),b.y-rnd(30,80),'#ffd16b',10);if(b.hp<=0){b.dead=1;waves=[];setNote('魔王倒下了！',300)}}
function doHit(){const p=player,reach=34+Math.min(p.weapon,3)*8,f=p.face;
 const front=(tx,hw)=>{const dx=(tx-p.x)*f;return dx>-10-hw&&dx<reach+hw},vOver=(ty,th)=>p.y>ty-th&&p.y-44<ty;
 if(boss&&!boss.dead&&front(boss.x,boss.hw-6)&&vOver(boss.y,boss.h))hitBoss(5);
 enemies.forEach(e=>{if(!e.dying&&front(e.x,e.hw)&&vOver(e.y,e.h))damageEnemy(e,p.damage,f)})}
function special(){const p=player;if(state!=='playing'||level<3||p.energy<100)return;p.energy=0;p.sp=22;p.atk=-1;beams.push({x:p.x+p.face*16,y:p.y-22,dir:p.face,hit:new Set()});burst(p.x+p.face*16,p.y-22,'#b79cff',20);shake=4;setNote('🌟 終極劍氣！',75)}
function spawnEnemy(){const t=levels[level-1].enemy,d=ETYPE[t],left=level>=2&&Math.random()<.25;enemies.push({type:t,x:left?-30:W+30,y:GROUND,hw:d.hw,h:d.h,hp:d.hp,dmg:d.dmg,spd:d.spd*rnd(.9,1.15),face:left?1:-1,atk:0,cool:30,stun:0,kb:0,hitT:0,dying:0,anim:Math.random()*4});spawned++}
function enemyStrike(e){const p=player;if(Math.abs(p.x-e.x)<e.hw+p.hw+22&&p.y>e.y-18)hurt(e.dmg,e.x)}
function updateBoss(){const b=boss,p=player;
 if(b.dead){b.dead++;if(b.dead%5===0)burst(b.x+rnd(-26,26),b.y-rnd(10,90),['#ff4a3a','#ffd16b','#fff'][b.dead%3],8);shake=2;if(b.dead>120)winGame();return}
 b.anim+=.08;if(b.hit>0)b.hit--;const dx=p.x-b.x,dist=Math.abs(dx),rage=b.hp<50;
 if(b.st==='walk'){b.face=dx>=0?1:-1;if(dist>90)b.x+=b.face*(rage?.6:.4);b.t--;if(b.t<=0){if(dist<85){b.st='swipe';b.t=26}else{b.st='slam';b.t=44}}}
 else if(b.st==='slam'){b.t--;if(b.t===0){waves.push({x:b.x+b.face*34,dir:b.face,life:220});if(rage)waves.push({x:b.x-b.face*34,dir:-b.face,life:220});shake=7;b.st='rest';b.t=40}}
 else if(b.st==='swipe'){b.t--;if(b.t===10&&Math.abs(p.x-b.x)<b.hw+40&&p.y>GROUND-30)hurt(14,b.x);if(b.t<=0){b.st='rest';b.t=30}}
 else{b.t--;if(b.t<=0){b.st='walk';b.t=rage?55:90}}
 b.x=clamp(b.x,250,W-40);
 if(Math.abs(p.x-b.x)<b.hw+p.hw-4&&p.y>GROUND-60)hurt(8,b.x)}

/* ============ 更新 ============ */
function update(){frame++;amb.forEach(a=>{a.x+=a.vx;a.y+=a.vy;if(a.x<0)a.x+=W;if(a.x>W)a.x-=W;if(a.y<0)a.y=205;if(a.y>205)a.y=0});
 if(shake>0)shake--;if(noticeTimer>0&&--noticeTimer===0)$('note').textContent=levels[level-1].tip;
 if(state!=='playing')return;
 const p=player,k=input.kb,t=input.touch,mv=((k.right||t.right)?1:0)-((k.left||t.left)?1:0);
 const spd=p.atk>=0?1.2:2.3;p.vx=mv*spd;if(mv)p.face=mv;
 if(p.kb){p.x+=p.kb;p.kb*=.82;if(Math.abs(p.kb)<.2)p.kb=0}
 p.x=clamp(p.x+p.vx,14,W-14);
 if(p.onGround)p.coyote=6;else if(p.coyote>0)p.coyote--;
 if(jumpBuf>0){jumpBuf--;if(p.coyote>0){p.vy=-8;p.onGround=false;p.coyote=0;jumpBuf=0;burst(p.x,p.y-1,'#cbb88a',5)}}
 const wasAir=!p.onGround;p.vy+=.5;p.y+=p.vy;if(p.y>=GROUND){p.y=GROUND;p.vy=0;p.onGround=true;if(wasAir)burst(p.x,p.y-1,'#cbb88a',4)}else p.onGround=false;
 if(mv&&p.onGround)p.anim+=.2;
 if(atkBuf>0)atkBuf--;if(spBuf>0){spBuf--;special()}
 if((atkBuf>0||k.atk||t.atk)&&p.atk<0&&p.cd<=0&&p.sp<=0){p.atk=0;atkBuf=0}
 else if(p.atk>=0){p.atk++;if(p.atk===6)doHit();if(p.atk>=ATK){p.atk=-1;p.cd=3}}
 if(p.cd>0)p.cd--;if(p.invuln>0)p.invuln--;if(p.sp>0)p.sp--;
 // 敵人
 if(level!==4){
  const alive=enemies.filter(e=>!e.dying).length;
  if(spawned<levels[level-1].count){spawnTimer--;if(spawnTimer<=0&&alive<4){spawnEnemy();spawnTimer=rnd(50,90)}}
  enemies.forEach(e=>{if(e.dying){e.dying++;return}if(e.hitT>0)e.hitT--;
   if(e.stun>0){e.stun--;e.x+=e.kb;e.kb*=.8}
   else{e.face=p.x>=e.x?1:-1;if(e.atk>0){e.atk--;if(e.atk===9)enemyStrike(e)}
    else{const dx=p.x-e.x,ad=Math.abs(dx);if(ad>e.hw+p.hw+12){e.x+=Math.sign(dx)*e.spd;e.anim+=.16}else if(e.cool<=0){e.atk=26;e.cool=80}}}
   if(e.cool>0)e.cool--;
   enemies.forEach(o=>{if(o!==e&&!o.dying&&Math.abs(o.x-e.x)<12){e.x+=(e.x<o.x?-.4:.4)}})});
  enemies=enemies.filter(e=>e.dying<32);
  if(clearT===0&&spawned>=levels[level-1].count&&enemies.length===0){clearT=100;setNote('關卡完成！',400)}
 }else if(boss)updateBoss();
 if(clearT>0&&--clearT===0){upgrade();return}
 // 衝擊波 / 劍氣
 waves.forEach(w=>{w.x+=w.dir*3;w.life--;if(frame%3===0)parts.push({x:w.x,y:GROUND-2,vx:rnd(-.5,.5),vy:rnd(-1.5,-.3),life:14,c:'#ffb04a',s:2});if(Math.abs(p.x-w.x)<10&&p.y>GROUND-14){hurt(12,w.x);w.life=0}});
 waves=waves.filter(w=>w.life>0&&w.x>-20&&w.x<W+20);
 beams.forEach(b=>{b.x+=b.dir*8;enemies.forEach(e=>{if(!e.dying&&!b.hit.has(e)&&Math.abs(e.x-b.x)<e.hw+14){b.hit.add(e);damageEnemy(e,p.damage+2,b.dir)}});
  if(boss&&!boss.dead&&!b.hit.has(boss)&&Math.abs(boss.x-b.x)<boss.hw+14){b.hit.add(boss);hitBoss(10)}
  if(frame%2===0)parts.push({x:b.x,y:b.y+rnd(-16,16),vx:0,vy:rnd(-.4,.4),life:14,c:'#b79cff',s:2})});
 beams=beams.filter(b=>b.x>-40&&b.x<W+40);
 parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.18;q.life--});parts=parts.filter(q=>q.life>0&&q.y<H);
 updateHUD()}

/* ============ 繪製 ============ */
const OL='#0e0a14';
const WEAP=[{b:'#b98a52',h:'#d9b07a',g:'#5b3b23',L:20},{b:'#c9d3dc',h:'#f4f8fa',g:'#7a5a30',L:24},{b:'#bfe3ff',h:'#ffffff',g:'#e0bf62',L:27},{b:'#ffe08a',h:'#ffffff',g:'#e08a2c',L:30}];
function swordAngle(p){if(p.sp>0)return -6;if(p.atk<0)return -52+(p.onGround?Math.sin(frame/18)*2:0);const t=p.atk/ATK;
 if(t<.3){const k=t/.3;return lerp(-52,-128,k*(2-k))}if(t<.62){const k=(t-.3)/.32;return lerp(-128,38,k*k)}const k=(t-.62)/.38;return lerp(38,-52,k*(2-k))}
function drawSword(p,alpha){const f=p.face,a=swordAngle(p),W0=WEAP[Math.min(p.weapon,3)];
 const idleBob=p.onGround&&!p.vx&&p.atk<0?(Math.floor(frame/30)%2):0;
 const sx=p.x+4*f,sy=p.y-26+idleBob,ar=rad(a*.45+22),hx=sx+Math.cos(ar)*10*f,hy=sy+Math.sin(ar)*10;
 const ux=Math.cos(rad(a))*f,uy=Math.sin(rad(a)),px=-uy,py=ux;const L=W0.L;
 ctx.save();if(alpha<1)ctx.globalAlpha=alpha;
 if(p.atk>=6&&p.atk<=13){for(let i=4;i>=1;i--){const aa=a-i*16,vx=Math.cos(rad(aa))*f,vy=Math.sin(rad(aa));ctx.globalAlpha=alpha*.16*(5-i);pline(hx+vx*5,hy+vy*5,hx+vx*(L+4),hy+vy*(L+4),'#ffffff',3)}ctx.globalAlpha=alpha}
 if(p.sp>0){ctx.globalAlpha=alpha*.5;pline(hx,hy,hx+ux*(L+14),hy+uy*(L+14),'#b79cff',5);ctx.globalAlpha=alpha}
 pline(sx,sy,hx,hy,OL,5);
 const g0x=hx-ux*3,g0y=hy-uy*3,gx=hx+ux*3,gy=hy+uy*3,tx=hx+ux*(4+L),ty=hy+uy*(4+L);
 pline(g0x,g0y,tx,ty,OL,5);pline(gx+px*4,gy+py*4,gx-px*4,gy-py*4,OL,4);
 pline(sx,sy,hx,hy,'#2c6d8c',3);
 pline(g0x,g0y,hx+ux*2,hy+uy*2,'#3a2a1c',3);
 pline(gx+ux,gy+uy,tx,ty,W0.b,3);pline(gx+ux+px,gy+uy+py,tx+px,ty+py,W0.h,1);
 pline(gx+px*3,gy+py*3,gx-px*3,gy-py*3,W0.g,2);
 ctx.fillStyle='#e9b98e';ctx.fillRect(Math.round(hx)-1,Math.round(hy)-1,3,3);
 ctx.restore()}
function drawPlayer(){const p=player,air=!p.onGround;
 const key=air?'j':(p.vx?'w'+(Math.floor(p.anim)%4):'i'+(Math.floor(frame/30)%2));
 const alpha=p.invuln>0&&Math.floor(frame/3)%2?.4:1;
 shadow(p.x,22,GROUND-p.y);blit(playerSprite(key),p.x,p.y,p.face,alpha);drawSword(p,alpha)}
function drawEnemy(e){const arm=e.atk>14?'r':e.atk>0?'s':'d',moving=!e.stun&&!e.atk,pose=moving?'w'+(Math.floor(e.anim)%4):'i'+(Math.floor(frame/30)%2);
 let s=enemySprite(e.type,pose,arm);if(e.hitT>0)s=whiteOf(e.type+pose+arm,s);
 shadow(e.x,e.hw*2.4,0);
 if(e.dying){const kk=Math.min(1,e.dying/10),a=clamp(1-(e.dying-14)/18,0,1);ctx.save();ctx.globalAlpha=a;ctx.translate(Math.round(e.x),GROUND);ctx.rotate(-e.face*Math.PI/2*kk);if(e.face<0)ctx.scale(-1,1);ctx.drawImage(s.c,-s.ax,-s.ay);ctx.restore();return}
 blit(s,e.x,e.y,e.face)}
function drawBoss(){const b=boss;if(!b)return;const rage=b.hp<50?1:0;
 let arm='d';if(b.st==='slam')arm=b.t>8?'u':'s';else if(b.st==='swipe')arm=b.t>10?'u':'s';
 const moving=b.st==='walk'&&Math.abs(player.x-b.x)>90,pose=moving?'w'+(Math.floor(b.anim*2)%2):'i'+(Math.floor(frame/40)%2);
 let s=bossSprite(pose,arm,rage);if(b.hit>0)s=whiteOf('X'+pose+arm+rage,s);
 shadow(b.x,70,0);
 if(rage&&!b.dead){ctx.save();ctx.globalAlpha=.12+.06*Math.sin(frame/6);ctx.fillStyle='#ff3030';ctx.fillRect(Math.round(b.x-40),GROUND-104,80,106);ctx.restore()}
 blit(s,b.x,b.y,b.face,b.dead?clamp(1-b.dead/130,0,1):1)}
function drawFX(){
 waves.forEach(w=>{const x=Math.round(w.x),h=12+Math.round(Math.sin(frame/3)*2);ctx.fillStyle='#7a1f3a';ctx.fillRect(x-8,GROUND-h-1,16,h+1);ctx.fillStyle='#e0502a';ctx.fillRect(x-6,GROUND-h+2,12,h-2);ctx.fillStyle='#ffd16b';ctx.fillRect(x-2,GROUND-h+5,4,h-5);ctx.globalAlpha=.4;ctx.fillStyle='#e0502a';ctx.fillRect(x-w.dir*14-6,GROUND-7,12,7);ctx.globalAlpha=1});
 beams.forEach(b=>{const x=Math.round(b.x),y=Math.round(b.y);[[6,'#5a3a96'],[4,'#b79cff'],[2,'#ffffff']].forEach(([th,col],i)=>{ctx.fillStyle=col;for(let dy=-20+i*2;dy<=20-i*2;dy++){const off=Math.round(dy*dy/34);ctx.fillRect(x-b.dir*off-(b.dir>0?th:0),y+dy,th,1)}});
  ctx.globalAlpha=.3;ctx.fillStyle='#b79cff';for(let dy=-14;dy<=14;dy++){const off=Math.round(dy*dy/34);ctx.fillRect(x-b.dir*(off+14)-(b.dir>0?4:0),y+dy,4,1)}ctx.globalAlpha=1});
 parts.forEach(q=>{ctx.fillStyle=q.c;ctx.fillRect(Math.round(q.x),Math.round(q.y),q.s,q.s)})}
function pixelText(t,x,y,size,color){ctx.font='bold '+size+'px "Noto Sans TC",monospace';ctx.fillStyle='#0e0a14';ctx.fillText(t,x+1,y+1);ctx.fillStyle=color||'#fff0c4';ctx.fillText(t,x,y)}
function render(){
 ctx.save();if(shake>0)ctx.translate(Math.round(rnd(-shake,shake)/2),Math.round(rnd(-shake,shake)/2));
 ctx.drawImage(bg,0,0);
 if(level===4)TORCH.forEach((x,i)=>{const fl=Math.floor(Math.sin(frame/4+i*2)*2),y=112;ctx.fillStyle='#5a4a3a';ctx.fillRect(x-3,y,6,3);ctx.fillStyle='#7a2a18';ctx.fillRect(x-4,y-8+fl,8,9-fl);ctx.fillStyle='#e0501e';ctx.fillRect(x-3,y-11+fl,6,10-fl);ctx.fillStyle='#ffd16b';ctx.fillRect(x-1,y-8+fl,3,7-fl);ctx.globalAlpha=.07+.03*Math.sin(frame/5+i);ctx.fillStyle='#ff9a4a';ctx.fillRect(x-36,y-40,72,80);ctx.globalAlpha=1});
 ctx.fillStyle=AMBC[level-1];amb.forEach(a=>{ctx.globalAlpha=.4+.4*Math.sin(frame/20+a.ph);ctx.fillRect(Math.round(a.x),Math.round(a.y),a.s,a.s)});ctx.globalAlpha=1;
 drawBoss();enemies.forEach(drawEnemy);drawPlayer();drawFX();
 ctx.restore();
 if(state==='playing'||state==='upgrade'){
  if(level!==4){pixelText('敵人 '+kills+'/'+levels[level-1].count,10,36,11);pixelText(player.weapon?'武器 Lv.'+(player.weapon+1):'木刀 Lv.1',10,50,9)}
  else if(boss){ctx.fillStyle='#0e0a14';ctx.fillRect(238,18,226,16);ctx.fillStyle='#4a1a28';ctx.fillRect(241,21,220,10);const bw=Math.round(220*boss.hp/100);ctx.fillStyle='#e3444c';ctx.fillRect(241,21,bw,10);ctx.fillStyle='#ff8a8a';ctx.fillRect(241,21,bw,2);pixelText('魔王 '+Math.ceil(boss.hp)+'%',240,15,10);pixelText('每次命中 -5%',10,36,11)}}}

/* ============ 主迴圈（固定 60Hz） ============ */
let last=performance.now(),acc=0;
function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=STEP){update();acc-=STEP}render();requestAnimationFrame(loop)}

/* ============ 輸入：鍵盤 ============ */
const KB={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
const JUMPK=['ArrowUp','KeyW','Space'],ATKK=['KeyJ','KeyZ','Enter'],SPK=['KeyK','KeyX'];
function releaseAll(){input.kb.left=input.kb.right=input.kb.atk=0;input.touch.left=input.touch.right=input.touch.atk=0;document.querySelectorAll('.pressed').forEach(b=>b.classList.remove('pressed'))}
window.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const c=e.code;
 const ov=!$('overlay').classList.contains('hidden');
 if(ov){if(c==='Enter'||c==='Space'){const b=document.querySelector('#overlay .mainbtn');if(b){e.preventDefault();if(!e.repeat)b.click()}}
  else if(state==='upgrade'&&['Digit1','Digit2','Digit3','Numpad1','Numpad2','Numpad3'].includes(c)){e.preventDefault();const n=+c.slice(-1)-1,b=document.querySelectorAll('[data-up]')[n];if(b)b.click()}return}
 if(KB[c]){e.preventDefault();input.kb[KB[c]]=1}
 else if(JUMPK.includes(c)){e.preventDefault();if(!e.repeat)jumpBuf=8}
 else if(ATKK.includes(c)){e.preventDefault();input.kb.atk=1;if(!e.repeat)atkBuf=8}
 else if(SPK.includes(c)){e.preventDefault();if(!e.repeat)spBuf=8}
 if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur()});
window.addEventListener('keyup',e=>{const c=e.code;if(KB[c])input.kb[KB[c]]=0;if(ATKK.includes(c))input.kb.atk=0});
window.addEventListener('blur',releaseAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()});

/* ============ 輸入：觸控 ============ */
const dpad=$('dpad'),dptr=new Map();
function dpRefresh(){let l=0,r=0;dptr.forEach(v=>{if(v<0)l=1;else r=1});input.touch.left=l;input.touch.right=r;$('btnL').classList.toggle('pressed',!!l);$('btnR').classList.toggle('pressed',!!r)}
function dirOf(e){const rc=dpad.getBoundingClientRect();return e.clientX<rc.left+rc.width/2?-1:1}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();try{dpad.setPointerCapture(e.pointerId)}catch(_){}dptr.set(e.pointerId,dirOf(e));dpRefresh()});
dpad.addEventListener('pointermove',e=>{if(dptr.has(e.pointerId)){dptr.set(e.pointerId,dirOf(e));dpRefresh()}});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>dpad.addEventListener(ev,e=>{dptr.delete(e.pointerId);dpRefresh()}));
document.querySelectorAll('[data-tap]').forEach(b=>{const act=b.dataset.tap;let id=null;
 b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}id=e.pointerId;b.classList.add('pressed');
  if(act==='jump')jumpBuf=8;else if(act==='attack'){input.touch.atk=1;atkBuf=8}else if(act==='special')spBuf=8});
 const up=e=>{if(id!==null&&e.pointerId!==id)return;id=null;b.classList.remove('pressed');if(act==='attack')input.touch.atk=0};
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,up))});
['contextmenu','selectstart','dragstart','gesturestart'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>{if(!e.target.closest('.overlay'))e.preventDefault()},{passive:false});

/* ============ 啟動 ============ */
resetPlayer();bg=getBG(0);initAmbient(1);updateHUD(true);requestAnimationFrame(loop);
})();
</script></body></html>
